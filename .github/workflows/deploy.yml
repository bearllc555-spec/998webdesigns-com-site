# GitHub Actions: build the Next.js app, then deploy the static export to Cloudflare Pages.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - scoped to Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID - e0f6f68f26f8a26a75eaa793385019ef
#
# Supabase NEXT_PUBLIC_* values are inlined below because the anon key is designed for
# public exposure (Supabase RLS enforces what it can do). If you rotate the project,
# update the env block here.
#
# Pages project name: 998webdesigns-com (existing — production custom domain 998webdesigns.com).
#
# Branch previews: every branch deploys to <branch-slug>.998webdesigns-com.pages.dev.
# main deploys to production. Wrangler picks the branch from GITHUB_REF automatically.
#
# ASCII-only commit messages — CF Pages deployments API rejects non-ASCII.

name: Build + deploy Next.js to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jxthwtflrzudepxysgje.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_41Gfbec-Z_tIQuPfloJjxg_3-VR1MQ
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=998webdesigns-com
